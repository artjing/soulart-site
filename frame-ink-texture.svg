<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <radialGradient id="wash-a" cx="22%" cy="18%" r="72%">
      <stop offset="0" stop-color="#737a73" stop-opacity=".34"/>
      <stop offset=".42" stop-color="#303530" stop-opacity=".16"/>
      <stop offset="1" stop-color="#080a08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash-b" cx="78%" cy="72%" r="70%">
      <stop offset="0" stop-color="#596059" stop-opacity=".22"/>
      <stop offset=".54" stop-color="#111411" stop-opacity=".08"/>
      <stop offset="1" stop-color="#070807" stop-opacity="0"/>
    </radialGradient>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .042" numOctaves="4" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="soft-noise">
        <feFuncR type="gamma" amplitude=".7" exponent="1.35" offset="0"/>
        <feFuncG type="gamma" amplitude=".76" exponent="1.3" offset="0"/>
        <feFuncB type="gamma" amplitude=".72" exponent="1.4" offset="0"/>
        <feFuncA type="table" tableValues="0 .42"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="soft-noise" mode="soft-light"/>
    </filter>
  </defs>
  <rect width="320" height="320" fill="#111411"/>
  <rect width="320" height="320" fill="url(#wash-a)"/>
  <rect width="320" height="320" fill="url(#wash-b)"/>
  <rect x="-20" y="-20" width="360" height="360" fill="#565c56" opacity=".38" filter="url(#ink)"/>
</svg>
